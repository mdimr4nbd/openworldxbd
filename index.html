<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OPENWORLDXBD — Official Bio & Developer Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Rubik+Wet+Paint&display=swap" rel="stylesheet">
<style>
:root{
  --bg-primary:#070b14;
  --bg-gradient:radial-gradient(circle at 38% 36%,rgba(37,99,235,.24) 0%,transparent 48%),radial-gradient(circle at 82% 45%,rgba(234,88,12,.22) 0%,transparent 46%),radial-gradient(circle at 22% 85%,rgba(59,130,246,.16) 0%,transparent 45%),linear-gradient(180deg,#070b14 0%,#090e1a 55%,#060911 100%);
  --card-bg:rgba(17,24,39,.72);
  --card-border:rgba(148,163,184,.16);
  --text-primary:#f8fafc;
  --text-secondary:#94a3b8;
  --text-muted:#64748b;
  --accent-blue:#3b82f6;
  --multi-gradient:linear-gradient(90deg,#3b82f6 0%,#60a5fa 45%,#fb923c 75%,#f97316 100%);
  --pill-bg:rgba(30,41,59,.75);
  --code-bg:#080d1a;
  --shadow-glow:0 12px 32px -8px rgba(15,23,42,.6);
  --avatar-bg:radial-gradient(circle at 50% 38%,rgba(59,130,246,.6) 0%,rgba(37,99,235,.25) 42%,#0b1426 78%);
  --panel-fill:#131c31;
  color-scheme:dark;
  box-sizing:border-box;
}
:root[data-theme="light"],html.light-theme{
  --bg-primary:#f4f6fb;
  --bg-gradient:radial-gradient(circle at 35% 30%,rgba(59,130,246,.16) 0%,transparent 48%),radial-gradient(circle at 82% 45%,rgba(249,115,22,.15) 0%,transparent 46%),linear-gradient(180deg,#eef2ff 0%,#f8fafc 100%);
  --card-bg:rgba(255,255,255,.88);
  --card-border:rgba(148,163,184,.25);
  --text-primary:#0f172a;
  --text-secondary:#475569;
  --text-muted:#64748b;
  --accent-blue:#2563eb;
  --multi-gradient:linear-gradient(90deg,#2563eb 0%,#3b82f6 45%,#f97316 80%,#ea580c 100%);
  --pill-bg:rgba(241,245,249,.95);
  --code-bg:#fff;
  --shadow-glow:0 12px 30px -8px rgba(15,23,42,.08);
  --avatar-bg:radial-gradient(circle at 50% 38%,rgba(59,130,246,.45) 0%,rgba(96,165,250,.22) 45%,#e8efff 80%);
  --panel-fill:#fff;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  min-height:100vh;
  width:100%;
  overflow-x:hidden;
  font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  -webkit-text-size-adjust:100%;
  background-color:var(--bg-primary);
  background-image:var(--bg-gradient);
  color:var(--text-primary);
  scroll-behavior:smooth;
  transition:background-color .35s ease,color .35s ease;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{display:flex;flex-direction:column}
#starfieldCanvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.app-shell{position:relative;z-index:1;flex:1;width:100%;max-width:480px;margin:0 auto;padding:calc(70px + env(safe-area-inset-top,0px)) 16px 14px;display:flex;flex-direction:column;gap:16px}

@keyframes orbitSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes orbitSpinReverse{from{transform:rotate(360deg)}to{transform:rotate(0deg)}}
@keyframes waveFloatBox{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-3.5px,0)}}
@keyframes iconHoverBob{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(0,-2px,0) scale(1.05)}}
@keyframes pulseGlow{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.85)}}
@keyframes liveCircleFlyOut{0%{transform:scale(1);opacity:.85}100%{transform:scale(2.3);opacity:0}}
@keyframes smoothMotionEntrance{0%{opacity:0;transform:translate3d(0,12px,0) scale(.985)}100%{opacity:1;transform:translate3d(0,0,0) scale(1)}}
@keyframes codeMotionScroll{0%{transform:translate3d(0,0,0)}100%{transform:translate3d(0,-50%,0)}}
@keyframes charSmoothAppear{0%{opacity:0;transform:translate3d(0,3px,0)}100%{opacity:1;transform:translate3d(0,0,0)}}
@keyframes cursorSmoothBlink{0%,100%{opacity:1}50%{opacity:.15}}
@keyframes clickPopBounce{0%{transform:scale(1)}40%{transform:scale(1.045)}75%{transform:scale(.99)}100%{transform:scale(1)}}

.click-pop{animation:clickPopBounce .38s cubic-bezier(.22,1,.36,1) forwards !important}

.top-navbar{position:fixed;top:0;left:0;right:0;width:100%;z-index:50;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);background:var(--card-bg);border-bottom:1px solid var(--card-border);box-shadow:var(--shadow-glow);transition:background-color .35s ease,border-color .35s ease}
.nav-inner{width:100%;max-width:480px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:calc(11px + env(safe-area-inset-top,0px)) 16px 11px}
@media(min-width:768px){
  .nav-inner{max-width:none;width:100%;padding:16px 40px}
  .brand-name{font-size:24px}
  .top-logo-orbit,.brand-logo-circle{width:30px;height:30px}
  .theme-toggle-btn{width:36px;height:36px}
  .app-shell{
    max-width:none;
    width:100%;
    min-height:auto;
    padding:92px 40px 24px;
    display:grid;
    grid-template-columns:1fr 1.15fr;
    grid-template-rows:auto auto auto;
    gap:22px 32px;
    align-items:start;
  }
  .hero-card{grid-column:1;grid-row:1;padding:34px 28px 30px}
  .avatar-wrapper,.avatar-circle{width:104px;height:104px;margin-bottom:16px}
  .hero-name{font-size:32px}
  .hero-verified-badge{width:28px;height:28px}
  .hero-subtitle{font-size:16px;margin-top:4px}
  .msg-section{grid-column:1;grid-row:2;display:block}
  .tabs-grid{gap:12px;padding:0}
  .tab-box{padding:12px 14px;font-size:14px;border-radius:15px}
  .tab-ico{width:22px;height:22px}
  .tab-ico svg{width:11px;height:11px}
  .tab-panel-card{padding:22px;border-radius:22px;margin-top:18px}
  .panel-icon-badge{width:38px;height:38px}
  .panel-icon-badge svg{width:18px;height:18px}
  .panel-title{font-size:17px}
  .panel-handle{font-size:13.5px}
  .fast-reply-badge{font-size:12px;padding:4px 11px}
  .panel-desc{font-size:14px;margin:12px 0}
  .panel-cta-btn{padding:13px 18px;font-size:14.5px;border-radius:14px;margin-top:6px}
  .section-label{grid-column:2;grid-row:1;align-self:start;font-size:13px;margin:2px 0 0}
  .links-stack{grid-column:2;grid-row:1 / 3;margin-top:26px;gap:14px}
  .link-card{flex:none;padding:17px 22px;border-radius:20px}
  .link-icon-box{width:38px;height:38px}
  .link-icon-box svg{width:18px;height:18px}
  .link-title{font-size:16px}
  .link-sub{font-size:13.5px;margin-top:2px}
  .link-arrow-circle{width:34px;height:34px}
  .code-window-card{grid-column:1 / -1;grid-row:3;border-radius:22px}
  .code-window-header{padding:12px 18px}
  .win-dot{width:11px;height:11px}
  .code-viewport{height:175px;padding:14px 20px;font-size:13.5px}
  .site-footer{padding:18px 40px 24px}
  .footer-inner{max-width:none;font-size:13px}
}
.brand-left{display:flex;align-items:center;gap:10px}
.top-logo-orbit{position:relative;width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-logo-circle{width:22px;height:22px;border-radius:50%;overflow:hidden;background:var(--multi-gradient);padding:1.5px;display:flex;align-items:center;justify-content:center}
.brand-logo-circle img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:var(--avatar-bg)}
.brand-title-group{display:flex;align-items:center;gap:5px}
.brand-name{
  font-family:'Rubik Wet Paint',cursive,sans-serif;
  font-size:19px;
  font-weight:400;
  font-style:normal;
  letter-spacing:.04em;
  display:inline-block;
  color:#60a5fa;
  background:var(--multi-gradient);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
}
.nav-actions{display:flex;align-items:center;gap:8px}
.theme-toggle-btn{width:28px;height:28px;border-radius:50%;border:1px solid var(--card-border);background:var(--pill-bg);color:var(--text-primary);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:transform .2s ease}
.theme-toggle-btn:active{transform:scale(.92)}
.hidden{display:none}

.hero-card{background:var(--card-bg);border:1px solid transparent;border-radius:26px;padding:26px 20px 22px;text-align:center;box-shadow:var(--shadow-glow);position:relative;overflow:hidden;animation:smoothMotionEntrance .6s cubic-bezier(.22,1,.36,1) both}
.hero-card::before{content:'';position:absolute;top:50%;left:50%;width:170%;height:220%;margin-top:-110%;margin-left:-85%;background:conic-gradient(from 0deg,transparent 0%,transparent 18%,#3b82f6 32%,#60a5fa 44%,transparent 54%,transparent 68%,#fb923c 82%,#f97316 94%,transparent 100%);animation:orbitSpin 6s linear infinite;pointer-events:none;z-index:0}
.hero-card::after{content:'';position:absolute;inset:1.5px;border-radius:24.5px;background:var(--bg-primary);background-image:var(--bg-gradient);z-index:0;pointer-events:none;transition:background-color .35s ease}
.hero-card>*{position:relative;z-index:1}

.avatar-wrapper{position:relative;width:86px;height:86px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center}
.avatar-dotted-ring{position:absolute;inset:-7px;border-radius:50%;padding:2.5px;background:conic-gradient(from 0deg,#3b82f6 0%,#60a5fa 25%,transparent 42%,transparent 55%,#fb923c 75%,#f97316 95%,#3b82f6 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask-composite:exclude;animation:orbitSpin 3.5s linear infinite;pointer-events:none}
.avatar-dotted-ring-inner{position:absolute;inset:-3.5px;border-radius:50%;border:1.5px dashed rgba(96,165,250,.65);animation:orbitSpinReverse 12s linear infinite;pointer-events:none}
.avatar-circle{width:86px;height:86px;border-radius:50%;overflow:hidden;padding:2.5px;background:var(--multi-gradient);box-shadow:0 8px 26px rgba(59,130,246,.28);position:relative;z-index:1}
.avatar-circle img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:var(--avatar-bg)}

.hero-name{
  font-family:'Rubik Wet Paint',cursive,sans-serif;
  font-size:25px;
  font-weight:400;
  font-style:normal;
  letter-spacing:.04em;
  line-height:1.25;
  display:inline-block;
  color:#60a5fa;
  background:var(--multi-gradient);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
}
.hero-title-row{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:4px}
.hero-verified-badge{width:25px;height:25px;color:#38bdf8;flex-shrink:0}
.hero-subtitle{font-size:14px;font-weight:600;color:var(--text-secondary);min-height:24px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.smooth-typing-wrapper{display:inline-flex;align-items:center;justify-content:center;flex-wrap:wrap}
.typed-char{display:inline-block;white-space:pre;color:var(--text-secondary);animation:charSmoothAppear .3s cubic-bezier(.22,1,.36,1) forwards;transition:opacity .2s ease,transform .2s ease}
.typing-cursor{display:inline-block;width:1.5px;height:13px;margin-left:5px;border-radius:2px;background:var(--multi-gradient);animation:cursorSmoothBlink .95s ease-in-out infinite;flex-shrink:0}

/* Zero Color-Flick Platform Tabs */
.tabs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 12px}
.tab-box{display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 10px;border-radius:14px;background:var(--card-bg);border:1px solid var(--card-border);color:var(--text-secondary);font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;position:relative;overflow:hidden;box-shadow:var(--shadow-glow);animation:waveFloatBox 3.6s ease-in-out infinite}
.tab-box:nth-child(1){animation-delay:0s}.tab-box:nth-child(2){animation-delay:.45s}.tab-box:nth-child(3){animation-delay:.9s}
.tab-box.active{color:var(--text-primary)}
.tab-box-icon{width:15px;height:15px;flex-shrink:0;animation:iconHoverBob 2.8s ease-in-out infinite}
.tab-ico{width:20px;height:20px;margin:0 3px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;border:1.5px solid currentColor;background-image:radial-gradient(circle at 50% 42%,rgba(255,255,255,.14) 0%,rgba(255,255,255,0) 70%);box-shadow:0 0 10px -2px currentColor,inset 0 0 8px -3px currentColor}
.tab-ico::before,.tab-ico::after{content:'';position:absolute;inset:-4px;border-radius:50%;pointer-events:none;border:1.5px solid transparent}
.tab-ico::before{border-color:currentColor;opacity:.2}
.tab-ico::after{border-top-color:currentColor;border-right-color:currentColor;filter:drop-shadow(0 0 2px currentColor);animation:orbitSpin 2.6s linear infinite}
.tab-box:nth-child(2) .tab-ico::after{animation-duration:3s;animation-delay:-.8s}
.tab-box:nth-child(3) .tab-ico::after{animation-duration:3.4s;animation-delay:-1.6s}
.tab-ico svg{width:10px;height:10px;fill:currentColor;animation:none}

.tab-panel-card{background:var(--card-bg);border:1px solid rgba(59,130,246,.32);border-radius:20px;padding:16px;box-shadow:0 12px 32px -8px rgba(37,99,235,.22);position:relative;margin-top:16px;transition:background-color .35s ease}
.panel-pointer{position:absolute;top:-11px;left:50%;width:28px;height:12px;margin-left:-14px;display:flex;align-items:flex-end;justify-content:center;transition:left .32s cubic-bezier(.16,1,.3,1);z-index:2;pointer-events:none}
.panel-pointer svg{width:28px;height:12px;display:block;overflow:visible}
.panel-pointer .ptr-fill{fill:var(--panel-fill);transition:fill .35s ease}
.panel-pointer .ptr-stroke{fill:none;stroke:rgba(59,130,246,.48);stroke-width:1.4;stroke-linecap:round}
.panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.panel-platform{display:flex;align-items:center;gap:10px}
.panel-icon-badge{width:32px;height:32px;margin:0 4px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;color:#38bdf8;border:2px solid currentColor;background-image:radial-gradient(circle at 50% 42%,rgba(255,255,255,.14) 0%,rgba(255,255,255,0) 70%);box-shadow:0 0 14px -2px currentColor,inset 0 0 12px -4px currentColor}
.panel-icon-badge::before,.panel-icon-badge::after{content:'';position:absolute;inset:-5px;border-radius:50%;pointer-events:none;border:1.5px solid transparent}
.panel-icon-badge::before{border-color:currentColor;opacity:.2}
.panel-icon-badge::after{border-top-color:currentColor;border-right-color:currentColor;filter:drop-shadow(0 0 3px currentColor);animation:orbitSpin 2.6s linear infinite}
.panel-icon-badge svg{width:15px;height:15px}
.panel-title{font-size:14px;font-weight:700;line-height:1.25;color:var(--text-primary)}
.panel-handle{font-size:12px;color:var(--text-secondary)}
.panel-desc{font-size:12px;line-height:1.6;color:var(--text-secondary)}
.fast-reply-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:rgba(16,185,129,.14);border:1px solid rgba(16,185,129,.35);color:#10b981;font-size:10.5px;font-weight:700}
.fast-reply-dot{width:6px;height:6px;border-radius:50%;background:#10b981;animation:pulseGlow 1.8s infinite}
.panel-cta-btn{width:100%;margin-top:12px;padding:11px 16px;border-radius:13px;border:none;font-family:inherit;font-size:13px;font-weight:700;color:#fff !important;background:#2563eb;background-image:linear-gradient(135deg,#3b82f6,#2563eb);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 6px 18px -4px rgba(59,130,246,.42)}

.section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--text-muted);padding-left:4px;margin-bottom:-6px}
.links-stack{display:flex;flex-direction:column;gap:10px;position:relative;z-index:5}
.link-card{width:100%;text-align:left;font-family:inherit;display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:18px;background:var(--card-bg);border:1px solid var(--card-border);color:var(--text-primary);box-shadow:var(--shadow-glow);position:relative;overflow:hidden;cursor:pointer;user-select:none;-webkit-user-select:none;animation:waveFloatBox 3.8s ease-in-out infinite;transition:background-color .35s ease,border-color .35s ease}
.link-card:nth-child(1){animation-delay:.2s}.link-card:nth-child(2){animation-delay:.7s}.link-card:nth-child(3){animation-delay:1.2s}.link-card:nth-child(4){animation-delay:1.7s}.link-card:nth-child(5){animation-delay:2.2s}
.link-card-left{display:flex;align-items:center;gap:12px;pointer-events:none}
.link-title{font-size:14px;font-weight:700;color:var(--text-primary)}
.link-sub{font-size:12px;color:var(--text-secondary)}
.link-icon-box{width:32px;height:32px;margin-right:4px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;border:2px solid currentColor;background-image:radial-gradient(circle at 50% 42%,rgba(255,255,255,.14) 0%,rgba(255,255,255,0) 70%);box-shadow:0 0 14px -2px currentColor,inset 0 0 12px -4px currentColor}
.link-icon-box::before,.link-icon-box::after{content:'';position:absolute;inset:-5px;border-radius:50%;pointer-events:none;border:1.5px solid transparent}
.link-icon-box svg{width:15px;height:15px}
.link-icon-box::before{border-color:currentColor;opacity:.2}
.link-icon-box::after{border-top-color:currentColor;border-right-color:currentColor;filter:drop-shadow(0 0 3px currentColor);animation:orbitSpin 2.6s linear infinite}
.link-card:nth-child(2) .link-icon-box::after{animation-duration:3s;animation-delay:-.8s}
.link-card:nth-child(3) .link-icon-box::after{animation-duration:3.4s;animation-delay:-1.6s}
.link-card:nth-child(4) .link-icon-box::after{animation-duration:3.8s;animation-delay:-2.4s}
.link-card:nth-child(5) .link-icon-box::after{animation-duration:4.2s;animation-delay:-3.2s}
.link-arrow-circle{width:30px;height:30px;border-radius:50%;background:var(--pill-bg);border:1px solid var(--card-border);display:flex;align-items:center;justify-content:center;color:var(--text-secondary);pointer-events:none}

.code-window-card{background:var(--code-bg);border:1px solid rgba(59,130,246,.32);border-radius:20px;overflow:hidden;box-shadow:0 14px 34px rgba(37,99,235,.22);animation:waveFloatBox 4.4s ease-in-out infinite}
.code-window-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(15,23,42,.95);border-bottom:1px solid rgba(148,163,184,.14)}
.window-dots{display:flex;align-items:center;gap:6px}
.win-dot{width:10px;height:10px;border-radius:50%}
.live-status-pill{display:inline-flex;align-items:center;justify-content:center;padding:4px;position:relative}
.live-status-dot{width:6px;height:6px;border-radius:50%;background:#10b981;box-shadow:0 0 6px rgba(16,185,129,.85);position:relative;display:block}
.live-status-dot::after{content:'';position:absolute;inset:0;border-radius:50%;border:1px solid #10b981;background:rgba(16,185,129,.35);animation:liveCircleFlyOut 1.6s cubic-bezier(.16,1,.3,1) infinite;pointer-events:none}
.code-viewport{height:148px;overflow:hidden;position:relative;padding:10px 14px;font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;line-height:1.65;color:#e2e8f0}
.code-viewport::before,.code-viewport::after{content:'';position:absolute;left:0;right:0;height:22px;z-index:2;pointer-events:none}
.code-viewport::before{top:0;background:linear-gradient(to bottom,#080d1a,transparent)}
.code-viewport::after{bottom:0;background:linear-gradient(to top,#080d1a,transparent)}
html.light-theme .code-window-card{background:#fff;border:1px solid rgba(148,163,184,.28);box-shadow:0 12px 28px -6px rgba(15,23,42,.08)}
html.light-theme .code-window-header{background:#f8fafc;border-bottom:1px solid rgba(148,163,184,.22)}
html.light-theme .code-viewport{color:#1e293b}
html.light-theme .code-viewport::before{background:linear-gradient(to bottom,#fff,transparent)}
html.light-theme .code-viewport::after{background:linear-gradient(to top,#fff,transparent)}
html.light-theme .line-num{color:#94a3b8}
html.light-theme .tok-kw{color:#7c3aed}html.light-theme .tok-var{color:#0284c7}html.light-theme .tok-prop{color:#2563eb}html.light-theme .tok-str{color:#16a34a}html.light-theme .tok-bool{color:#ea580c}
.code-scroll-track{display:flex;flex-direction:column;animation:codeMotionScroll 14s linear infinite;will-change:transform}
.code-line{display:flex;gap:12px;white-space:pre}
.line-num{color:#475569;user-select:none;min-width:18px;text-align:right}

/* Bounce effect and safe external navigation */
function handleBounceAndOpen(el, url){
  if (el) {
    el.classList.remove('click-pop');
    void el.offsetWidth;
    el.classList.add('click-pop');
    setTimeout(() => el.classList.remove('click-pop'), 400);
  }
  if (!url) return;
  setTimeout(() => {
    try {
      const a = document.createElement('a');
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    } catch (e) {
      window.open(url, '_blank', 'noopener,noreferrer');
    }
  }, 140);
}

}

/* Theme toggle */
(function(){
  const root = document.documentElement, btn = document.getElementById('themeToggleBtn');

  function apply(light){
    root.classList.toggle('light-theme', light);
    root.setAttribute('data-theme', light ? 'light' : 'dark');
    sun.classList.toggle('hidden', light);
    moon.classList.toggle('hidden', !light);
    try { localStorage.setItem('owxbd-theme', light ? 'light' : 'dark'); } catch(e){}
  }
  let saved = null;
  try { saved = localStorage.getItem('owxbd-theme'); } catch(e){}
  if (saved) apply(saved === 'light');
  btn.addEventListener('click', () => apply(!root.classList.contains('light-theme')));
})();

/* Typing animation */
(function(){
  const el = document.getElementById('typingText');
  const phrase = 'Assalamualaikum - আসসালামু আলাইকুম';
  const chars = (typeof Intl !== 'undefined' && Intl.Segmenter)
    ? Array.from(new Intl.Segmenter('bn',{granularity:'grapheme'}).segment(phrase), s=>s.segment)
    : Array.from(phrase);
  let i = 0, del = false;
  function step(){
    if (!del){
      if (i < chars.length){
        const s = document.createElement('span'); s.className='typed-char'; s.textContent=chars[i++]; el.appendChild(s); setTimeout(step,58);
      } else { del = true; setTimeout(step,2600); }
    } else if (i > 0){
      const last = el.lastElementChild;
      if (last){ last.style.opacity='0'; last.style.transform='translateY(-2px)'; }
      setTimeout(()=>{ if (el.lastElementChild) el.removeChild(el.lastElementChild); i--; step(); },34);
    } else { del = false; setTimeout(step,550); }
  }
  step();
})();

/* Lightweight Falling Stars */
window.addEventListener('load', () => {
  const canvas = document.getElementById('starfieldCanvas'), ctx = canvas.getContext('2d');
  let w = 0, h = 0, stars = [];
  const palette = [[59,130,246],[96,165,250],[251,146,60],[249,115,22],[148,163,184]];
  function resize(){ w = canvas.width = innerWidth; h = canvas.height = innerHeight; }
  function make(n){
    stars = [];
    for (let i=0;i<n;i++) stars.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.7+.7,vy:Math.random()*.8+.3,vx:(Math.random()-.5)*.2,a:Math.random()*.65+.3,c:palette[i%palette.length]});
  }
  function loop(){
    if (!document.hidden) {
      ctx.clearRect(0,0,w,h);
      const light = document.documentElement.classList.contains('light-theme');
      for (const s of stars){
        s.y += s.vy; s.x += s.vx;
        if (s.y > h+6){ s.y = -6; s.x = Math.random()*w; }
        if (s.x < 0) s.x = w; if (s.x > w) s.x = 0;
        ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
        ctx.fillStyle = 'rgba('+s.c[0]+','+s.c[1]+','+s.c[2]+','+(light?s.a*.65:s.a)+')'; ctx.fill();
      }
    }
    requestAnimationFrame(loop);
  }
  resize(); make(36); loop();
  addEventListener('resize', () => { resize(); make(36); });
});
